schema: app-level-sdd

context: |
  Application-level specification and acceptance repository. Component repositories
  own implementation and independent SDD cycles. Follow the app-level-sdd schema.
  No component split or repository is selected by this setup.

operations:
  archive:
    guidance:
      - Require explicit human acceptance and successful integrated acceptance before archiving. Verification alone is not human acceptance.
      - Read and preserve the mapped Linear parent, including canceled status. Require complete tasks and verified spec synchronization before successful archive.
      - Only after explicit human acceptance and successful archive, move the parent to Done unless canceled. Never mark Done during apply or verification.
      - If archive fails, leave parent status unchanged. If archive succeeds but the Linear update fails, report archive success and remote failure separately; do not claim Done. Reconcile before retrying.
