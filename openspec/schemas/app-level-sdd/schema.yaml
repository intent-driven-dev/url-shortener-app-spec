name: app-level-sdd
version: 1
description: Application proposal, Gherkin specs, architecture and component handoffs
artifacts:
  - id: proposal
    generates: "proposal.md"
    description: Application proposal
    template: proposal.md
    instruction: |
      Read canonical specs and existing architecture records. Preserve Why, What Changes (scope and non-goals), Capabilities (New and Modified using exact relative paths), and Impact. Associate the change with one existing Linear parent issue before completing the proposal. Reuse openspec/linear.yaml team/project and <changeRoot>/linear.yaml issue: {id, identifier, url}; preserve unrelated metadata. If mappings are missing, discover options and ask the user to select an existing team/project and parent issue. Never invent IDs or create a parent issue. Link the parent in the proposal. This repository owns application specifications, architecture, handoffs and acceptance infrastructure; component repositories own implementation and their own SDD cycles.
    requires: []
  - id: specs
    generates: "specs/**/*.md"
    description: Application specs
    template: spec.md
    instruction: |
      Use .agents/skills/gherkin/SKILL.md. Read the completed proposal and canonical specs. Write specs/<capability-path>/spec.md using OpenSpec ADDED, MODIFIED, REMOVED and RENAMED Requirements delta sections. Keep ### Requirement: and #### Scenario: headings. Use SHALL/MUST and observable behavior, concrete inputs, outputs, errors and boundaries, not implementation instructions. Each executable scenario has exactly one fenced gherkin block containing Given/When/Then steps (And/But as appropriate); the Markdown heading supplies the Scenario title. Scenario Outline blocks may contain Examples. No Feature/Scenario headers inside fences. Keep scenarios independent, deterministic, and focused on one observable rule. Use tables/doc strings where helpful. Do not embed Markdown headings inside doc strings. No hidden setup, forced failure or pending placeholders. New capabilities include a meaningful Purpose. MODIFIED contains the entire updated requirement, retaining unaffected scenarios; removing a scenario is an explicit behavioral change. REMOVED supplies Reason and Migration; RENAMED uses - FROM: `### Requirement: old` and - TO: `### Requirement: new`. specs remain authoritative; generated features are disposable. Complete specs before Design.
    requires: ["proposal"]
  - id: design
    generates: "design.md"
    description: Application design
    template: design.md
    instruction: |
      Use .agents/skills/boundary-clarification/SKILL.md and .agents/skills/adrs/SKILL.md. Read completed specs, architecture/adrs/, architecture/boundary.md and architecture/components.md if present. Reuse accepted decisions without asking again. Ask the user for missing or conflicting component splits and Git repository locations; every component requires a user-provided Git repository. Do not infer repositories from local directories or invent a component architecture. Record decisions, alternatives, rationale and status in numbered ADRs; supersede prior decisions with linked ADRs rather than rewriting history. Derive and maintain architecture/boundary.md (responsibilities, shared interfaces, integration constraints) and architecture/components.md (stable IDs, user-provided repository locations, known runtime setup) from accepted decisions. Update both when decisions change. Both maintained documents are mandatory before Design is complete; they and ADRs are supporting records, not lifecycle stages. Describe affected component IDs. Before Design completion and component handoff, resolve all applicable integration agreements: API operations (methods/paths), request/response payloads, statuses and errors, authentication, versions, dependencies and caller/provider relationships. Record schemes, consumer-facing hosts/ports and path prefixes separately from listening addresses. Require agreed acceptance-environment values or an explicit allocation/discovery mechanism. Capture browser origin, API base URL, public-link origin, browser connectivity, CORS/credential behavior, externally required configuration inputs and readiness checks. Mark inapplicable items explicitly. Component technology remains its owner's choice. Defer install/start commands and internal configuration details until delivery inspection, never externally required agreements. Resolve architectural questions before Tasks. Keep implementation inside component repositories.
    requires: ["specs"]
  - id: tasks
    generates: "tasks.md"
    description: Application tasks
    template: tasks.md
    instruction: |
      Use .agents/skills/acceptance-testing/SKILL.md. Read completed Design, specs and all architecture records. Create or reconcile exactly one Linear child issue per affected component under the mapped parent. Inspect existing children and stored mappings first; reuse matching component IDs on resumption. Resolve duplicates rather than creating more. Each child independently includes the repository, relevant full behavior and Gherkin, responsibilities, accepted integration contracts and acceptance-environment agreements, dependencies, completion conditions, delivery revision requirements and parent link, sufficient for its own component SDD. Record stable component ID, child ID, identifier and URL in tasks.md and preserve mappings in <changeRoot>/linear.yaml. Do not complete Tasks until every handoff is verifiable. Use the template's four ordered groups of numbered checkbox tasks with observable verification. After successful task authoring, move the parent to Todo unless canceled. Report remote failures accurately, leave failed work unfinished, and reconcile before retrying. Never claim a remote operation succeeded without evidence.
    requires: ["design"]
apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Use .agents/skills/acceptance-testing/SKILL.md. Run all npm commands from verification/ (cd verification first). Read all artifacts and architecture records. Use verification/README.md for harness composition, generation, execution and reporting. Do not modify specs, drop scenarios or weaken assertions to make acceptance pass. Component behavior failures require correction in the responsible component repository, a new delivery and renewed gate and integrated verification; binding or harness defects may be fixed while preserving specified expectations. On apply start move the mapped parent to In Progress unless canceled; preserve canceled parents throughout all operations. Report failed remote operations accurately. Execute tasks in strict order:
    1. Prepare executable acceptance: extract canonical specs composed with only the selected change deltas; implement every required JavaScript step with real UI/API interactions and assertions. Run npm test -- --change <name>. The harness validates every binding before execution, including downstream steps. Reject undefined/ambiguous bindings, pending placeholders and deliberately forced failures. Retain failing reports and command evidence in verification.md. Connection failures count as initial failure but label them unavailable-application evidence, not exercised behavior. Skips after an earlier failure are acceptable only in this initial run and only with complete bindings. Investigate unexpectedly passing acceptance; never manufacture failure.
    2. Check component delivery: fetch each required child's CURRENT Linear status and delivery evidence. Record timestamp, status, link and usable revision for each. Complete this gate only if EVERY child is Done with usable delivery evidence. Unfinished, canceled or unverifiable child: leave the gate unchecked and EXIT IMMEDIATELY, explain inability to proceed and link blockers. Do not inspect/start delivered applications or run dependent tasks. On every resumption refresh this check BEFORE any dependent task, even if previously checked; clear a stale gate.
    3. Populate application configuration in verification/scripts/app.mjs from Design, component registry and delivered repository instructions. Retrieve repositories into a fresh temporary workspace at delivered revisions; when unspecified resolve and record remote default-branch commits. Inspect delivered instructions to resolve deferred install/start commands and internal configuration. Verify accepted integration and acceptance-environment agreements rather than adopting incompatible delivered defaults. Install, start and verify readiness using npm run app:start. Record revisions and commands.
    4. Run npm test -- --change <name> against live endpoints. Require a nonempty suite and every scenario/step passing, with no pending, undefined, ambiguous, skipped or filtered-out scenarios. Record delivery evidence, commands, revisions, endpoints, outcomes and report paths in verification.md. Stop harness-owned processes using npm run app:stop, including on failure. Do not stop externally managed applications.
    Only mark tasks complete with evidence. After successful integrated acceptance, inspect parent comments for this change's review request; reuse equivalent comments or update corrections, never post duplicates. If comments cannot be inspected, report failure without posting blindly. Include change, summary and verification in review request; retain In Progress, never move to In Review or Done. Human acceptance and successful archive are needed for Done. No application code is implemented here.
